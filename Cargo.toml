[package]
name = "payment-gateway"
version = "0.1.0"
edition = "2024"

[lib]
name = "payment_gateway"
path = "src/lib.rs"

[[bin]]
name = "payment-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "chrono", "migrate", "runtime-tokio", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
subtle = "2"
log = "0.4"
env_logger = "0.11"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
