[package]
name = "payment-gateway-client"
version = "0.1.0"
edition = "2021"
description = "Client for the payment gateway API with webhook verification"
license = "MIT"
readme = "README.md"
keywords = ["payments", "lightning", "bitcoin", "webhooks"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[workspace]
