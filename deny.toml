[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is pulled in by sqlx-mysql and only used for the MySQL password handshake, never exposed to untrusted input" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile comes from fedimint-tonic-lnd, parses our own operator supplied LND certs only" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no drop-in fix; required by sqlx and payments-rs" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MITNFA",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
